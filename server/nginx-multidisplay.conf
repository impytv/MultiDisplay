# The MultiDisplay firmware update site (docs/auto-update-plan.md), served
# on the home network from the Raspberry Pi that builds the firmware.
#
#   sudo apt install nginx
#   sudo mkdir -p /srv/multidisplay && sudo chown $USER: /srv/multidisplay
#   sudo cp server/nginx-multidisplay.conf /etc/nginx/sites-available/multidisplay
#   sudo ln -s /etc/nginx/sites-available/multidisplay /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Plain HTTP is enough: the displays only install images signed with the
# project's key, whatever server they came from.

server {
    listen 8070;
    listen [::]:8070;
    server_name _;

    root /srv/multidisplay;
    index index.html;
    autoindex off;

    # Only reading: nginx answers anything but GET and HEAD on static files
    # with 405 by itself.

    # Manifests and the index change with every release: never cached.
    location ~ \.(json|html)$ {
        add_header Cache-Control "no-store";
    }

    # An image never changes once published (versions aren't reused).
    location /firmware/ {
        types { application/octet-stream bin; }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The publish script's temporary files.
    location ~ /\. { deny all; }
}
