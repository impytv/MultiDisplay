# The Værtavla firmware update site (docs/auto-update-plan.md), served
# on the home network from the Raspberry Pi that builds the firmware. Runs
# in the nginx container from server/compose.yaml, which mounts the site
# folder (/srv/multidisplay) read-only at /usr/share/nginx/html.
#
# Plain HTTP is enough: the displays only install images signed with the
# project's key, whatever server they came from.

# Error reports (/feil/ below): who sent one. Through the tunnel every
# request comes from its container (on compose's network, 172.16.0.0/12),
# so there it's the address Cloudflare gives in CF-Connecting-IP, which it
# sets itself; anyone else could set that header too, so from elsewhere it
# is the request's own address. Never empty: a request without a key isn't
# limited.
geo $feil_docker {
    default 0;
    172.16.0.0/12 1;
}
map "$feil_docker:$http_cf_connecting_ip" $feil_sender {
    "~^1:(?<cf>[0-9a-fA-F.:]{2,45})$" $cf;
    default $remote_addr;
}
# A few reports a minute and two at once from one sender.
limit_req_zone $feil_sender zone=feil:1m rate=3r/m;
limit_conn_zone $feil_sender zone=feil_conn:1m;

server {
    # The unprivileged image can't bind below 1024; compose.yaml publishes
    # this as port 8070 on the Pi.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;

    # Only reading: nginx answers anything but GET and HEAD on static files
    # with 405 by itself.

    # Manifests and the index change with every release: never cached.
    location ~ \.(json|html)$ {
        add_header Cache-Control "no-store";
    }

    # An image never changes once published (versions aren't reused).
    location /firmware/ {
        types { application/octet-stream bin; }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Calendar feeds (server/kalender/, mounted by compose.yaml) for the
    # calendar screen or a phone's calendar app; checked again within an hour.
    location /kalender/ {
        types { text/calendar ics; }
        charset utf-8;
        charset_types text/calendar;
        add_header Cache-Control "public, max-age=3600";
    }

    # The guides' pictures (server/montering/ and server/bruk/, mounted by
    # compose.yaml), and the radio logos the displays fetch (bruk/radio/,
    # scripts/build_radio_logos.py).
    location ~ ^/(montering/bilder|bruk/skjermer|bruk/radio)/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # Radio that Sonos can pause (radio/radio_proxy.py in the radio
    # container), for the speakers at home: not through the tunnel, whose
    # requests come from its container's address.
    location ^~ /radio/ {
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://radio:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    # Error reports from the displays' navigation page (feil/feil.py in the
    # feil container), from anywhere: a display can be away from home.
    location = /feil/ {
        limit_except POST { deny all; }
        limit_req zone=feil burst=5 nodelay;
        limit_req_status 429;
        limit_conn feil_conn 2;
        limit_conn_status 429;
        client_max_body_size 4m;
        client_body_timeout 20s;
        proxy_pass http://feil:8080;
        proxy_set_header X-Sender $feil_sender;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 30s;
    }

    # The publish script's temporary files.
    location ~ /\. { deny all; }
}
