# The MultiDisplay firmware update site (docs/auto-update-plan.md), served
# on the home network from the Raspberry Pi that builds the firmware. Runs
# in the nginx container from server/compose.yaml, which mounts the site
# folder (/srv/multidisplay) read-only at /usr/share/nginx/html.
#
# Plain HTTP is enough: the displays only install images signed with the
# project's key, whatever server they came from.

server {
    # The unprivileged image can't bind below 1024; compose.yaml publishes
    # this as port 8070 on the Pi.
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;

    # Only reading: nginx answers anything but GET and HEAD on static files
    # with 405 by itself.

    # Manifests and the index change with every release: never cached.
    location ~ \.(json|html)$ {
        add_header Cache-Control "no-store";
    }

    # An image never changes once published (versions aren't reused).
    location /firmware/ {
        types { application/octet-stream bin; }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Calendar feeds (server/kalender/, mounted by compose.yaml) for the
    # calendar screen or a phone's calendar app; checked again within an hour.
    location /kalender/ {
        types { text/calendar ics; }
        charset utf-8;
        charset_types text/calendar;
        add_header Cache-Control "public, max-age=3600";
    }

    # The publish script's temporary files.
    location ~ /\. { deny all; }
}
