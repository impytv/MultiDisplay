# The firmware update site in Docker (docs/auto-update-plan.md):
#
#   cd server && docker compose up -d
#
# nginx serves the site folder that scripts/publish_firmware.py writes,
# read-only, on port 8070 - the address the displays already use. The
# container starts again by itself after a restart of the Pi.
#
# Optionally, cloudflared makes the same site reachable from outside the
# LAN over HTTPS through a Cloudflare Tunnel, without opening a port on the
# router. It only starts when .env (next to this file, kept out of git)
# turns it on - see .env.example and the README.

services:
  update-site:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    container_name: multidisplay-update-site
    restart: unless-stopped
    ports:
      - "8070:8080"
    volumes:
      # The folder, not single files: the publish script replaces files by
      # renaming, which a mount of one file would not see.
      - ${MULTIDISPLAY_SITE:-/srv/multidisplay}:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Calendar feeds straight from the repo, so an edit is live at once.
      - ./kalender:/usr/share/nginx/html/kalender:ro
      # The assembly and usage guides, likewise; each needs an empty folder of
      # its name in the site folder to mount onto.
      - ./montering:/usr/share/nginx/html/montering:ro
      - ./bruk:/usr/share/nginx/html/bruk:ro
      # Where Spotify sends a display's login back to (main/spotify.c).
      - ./spotify:/usr/share/nginx/html/spotify:ro
    depends_on:
      - radio
      - feil
    networks:
      - default
      - feil
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Radio that Sonos can pause (radio/radio_proxy.py), at /radio/ of the
  # update site through nginx, from the home network only.
  radio:
    build: ./radio
    image: multidisplay-radio
    container_name: multidisplay-radio
    restart: unless-stopped
    command: python -I -u /app/radio_proxy.py
    volumes:
      - ./radio:/app:ro
    environment:
      # How long a paused station is kept, recorded, for Play to go on.
      RADIO_PAUSE_MINUTES: ${RADIO_PAUSE_MINUTES:-60}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Error reports from the displays' navigation page (feil/feil.py), at
  # /feil/ of the update site through nginx, kept in the folder below and
  # pushed to an ntfy topic (.env.example). The folder is made by the user
  # who runs the service (uid 1000), before the first start.
  feil:
    build: ./feil
    image: multidisplay-feil
    container_name: multidisplay-feil
    restart: unless-stopped
    command: python -I -u /app/feil.py
    user: "1000:1000"
    volumes:
      - ./feil:/app:ro
      - ${MULTIDISPLAY_REPORTS:-./feilmeldinger}:/data
    environment:
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.sh}
    # Its own network with nginx only, so the limits there can't be gone
    # around from another container; out to ntfy through it.
    networks:
      - feil
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    container_name: multidisplay-tunnel
    profiles:
      - tunnel
    restart: unless-stopped
    # The tunnel's public hostname is set up at Cloudflare and points to
    # http://update-site:8080 here.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - update-site
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  feil:
