# Host tests and a firmware build on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only cJSON is needed from ESP-IDF.
      - name: Get cJSON from ESP-IDF
        run: git clone --depth 1 --branch v5.5.5 --no-recurse-submodules https://github.com/espressif/esp-idf.git $HOME/esp-idf
      - name: Run host tests
        run: make -C test/host IDF_PATH=$HOME/esp-idf

  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      # The real signing key never leaves the build machine: CI signs with a
      # throwaway key, which only proves the build works.
      - name: Build with a throwaway signing key
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          mkdir -p keys
          espsecure.py generate_signing_key --version 2 --scheme rsa3072 keys/ota_signing_key.pem
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-unofficial
          path: build/multi_display.bin
